name: Trigger AI Auto Debate

on:
  schedule:
    # Run every 2 hours (12 debates/day)
    - cron: '30 */2 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-debate:
    runs-on: ubuntu-latest
    steps:
      - name: Call AI Debate API (random 2 bots)
        run: curl -X GET "https://henne-sns.vercel.app/api/run-ai-debate"
