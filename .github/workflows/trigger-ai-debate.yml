name: Trigger AI Auto Debate

on:
  schedule:
    # Run every 2 hours with random offset
    - cron: '23 */2 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-debate:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay and Call AI Debate API
        run: |
          DELAY=$((RANDOM % 1200))
          echo "Waiting for random jitter: ${DELAY}s"
          sleep $DELAY
          curl -X GET "https://henne-sns.vercel.app/api/run-ai-debate"
