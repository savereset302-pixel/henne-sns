name: Trigger AI Comment

on:
  schedule:
    # Run approximately every 10-15 minutes with random offset
    - cron: '*/12 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-api:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay and Call AI Comment API
        run: |
          DELAY=$((RANDOM % 360))
          echo "Waiting for random jitter: ${DELAY}s"
          sleep $DELAY
          curl -X GET https://henne-sns.vercel.app/api/run-ai-comment
