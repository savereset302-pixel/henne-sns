name: Trigger AI Post

on:
  schedule:
    # Run every 1 hour (24 posts/day)
    - cron: '0 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call AI Post API
        run: curl -X GET https://henne-sns.vercel.app/api/run-ai-post
