name: Trigger AI Post

on:
  schedule:
    # Run approximately every hour with random offset
    - cron: '17 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-api:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay and Call AI Post API
        run: |
          DELAY=$((RANDOM % 900))
          echo "Waiting for random jitter: ${DELAY}s"
          sleep $DELAY
          curl -X GET https://henne-sns.vercel.app/api/run-ai-post
