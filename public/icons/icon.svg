<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glowing Heart-Message Bubble Symbol -->
  <g filter="url(#shadow)">
    <!-- Stylized speech bubble heart -->
    <path d="M256 128 C200 64, 112 96, 112 184 C112 264, 210 336, 256 376 C302 336, 400 264, 400 184 C400 96, 312 64, 256 128 Z" fill="url(#glow)"/>
    <!-- Small dialogue tail -->
    <path d="M210 355 L168 412 Q160 422 172 418 L240 385 Z" fill="url(#glow)"/>
    <!-- Inner soft core -->
    <circle cx="256" cy="200" r="28" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>